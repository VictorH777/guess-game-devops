version: "3.8"

services:

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: game
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend1:
    build: ./backend
    restart: always
    depends_on:
      - postgres
    networks:
      - app-network

  backend2:
    build: ./backend
    restart: always
    depends_on:
      - postgres
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend1
      - backend2
      - frontend
    networks:
      - app-network

  frontend:
    build: ./frontend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network: